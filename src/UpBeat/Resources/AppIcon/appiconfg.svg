<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Moved down by 2 pixels so that the headphones are centered vertically -->
  <g fill="#FF102E" shape-rendering="crispEdges" transform="translate(0 2)">
    <!-- Headband -->
    <rect x="22" y="10" width="20" height="2"/>
    <rect x="18" y="12" width="28" height="2"/>
    <rect x="16" y="14" width="32" height="4"/>
    <rect x="14" y="18" width="4" height="14"/>
    <rect x="46" y="18" width="4" height="14"/>
    <rect x="12" y="22" width="4" height="12"/>
    <rect x="48" y="22" width="4" height="12"/>

    <!-- Left earcup -->
    <rect x="10" y="30" width="6" height="16"/>
    <rect x="12" y="28" width="10" height="20"/>
    <rect x="14" y="26" width="10" height="24"/>
    <rect x="16" y="28" width="10" height="20"/>
    <rect x="18" y="30" width="8" height="16"/>

    <!-- Right earcup -->
    <rect x="48" y="30" width="6" height="16"/>
    <rect x="42" y="28" width="10" height="20"/>
    <rect x="40" y="26" width="10" height="24"/>
    <rect x="38" y="28" width="10" height="20"/>
    <rect x="38" y="30" width="8" height="16"/>

    <!-- Pixel cutouts -->
    <rect x="16" y="32" width="2" height="12" fill="#000000"/>
    <rect x="20" y="30" width="2" height="16" fill="#000000"/>
    <rect x="46" y="32" width="2" height="12" fill="#000000"/>
    <rect x="42" y="30" width="2" height="16" fill="#000000"/>
  </g>
</svg>
